name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build for e2e
        run: npm run build-only

      - name: Run Cypress e2e
        run: npx start-server-and-test preview http://localhost:4173 'npx cypress run --e2e'
